<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ostryn — Ghost-Data Audit Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/appwrite@18.2.0"></script>
</head>
<body>
  <header>
    <div class="brand">
      <svg class="ghost" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
        <path d="M12 2C7.6 2 4 5.6 4 10v10.2c0 .8.9 1.3 1.6.8l2-1.4 2 1.4c.5.3 1.1.3 1.6 0l2-1.4 2 1.4c.7.5 1.6 0 1.6-.8V10c0-4.4-3.6-8-8-8Z" fill="currentColor"/>
        <circle cx="9.2" cy="10" r="1.4" fill="var(--bg)"/>
        <circle cx="14.8" cy="10" r="1.4" fill="var(--bg)"/>
      </svg>
      <div>
        <h1>Ostryn</h1>
        <p class="sub">ghost-data audit explorer · powered by Appwrite TablesDB</p>
      </div>
    </div>
    <div id="stats"></div>
  </header>

  <main>
    <aside>
      <input id="search" type="search" placeholder="Search case id or email…" spellcheck="false" />
      <div id="filters">
        <button data-f="ALL" class="on">All</button>
        <button data-f="COMPLETE">Complete</button>
        <button data-f="INCOMPLETE">Incomplete</button>
        <button data-f="NOT_APPLICABLE">N/A</button>
      </div>
      <ul id="cases"></ul>
    </aside>

    <section id="detail">
      <div class="empty">
        <svg class="ghost big" viewBox="0 0 24 24" width="72" height="72" aria-hidden="true">
          <path d="M12 2C7.6 2 4 5.6 4 10v10.2c0 .8.9 1.3 1.6.8l2-1.4 2 1.4c.5.3 1.1.3 1.6 0l2-1.4 2 1.4c.7.5 1.6 0 1.6-.8V10c0-4.4-3.6-8-8-8Z" fill="currentColor"/>
          <circle cx="9.2" cy="10" r="1.4" fill="var(--bg)"/>
          <circle cx="14.8" cy="10" r="1.4" fill="var(--bg)"/>
        </svg>
        <p>The ghosts are quiet. Select a case to hunt.</p>
      </div>
    </section>
  </main>

  <div id="evpop" hidden></div>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
